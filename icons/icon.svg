  <circle cx="256" cy="416" r="14" fill="#38BDF8" opacity="0.8" />
  <!-- Lightning Bolt -->
  <path d="M280 80 L160 272 H260 L232 432 L368 240 H268 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
